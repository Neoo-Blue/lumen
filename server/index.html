<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#07080d">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Lumen">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="/icons/icon-180.png">
<link rel="icon" href="/icons/icon-192.png">
<title>Lumen</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha384-sHL9NAb7lN7rfvG5lfHpm643Xkcjzp4jFvuavGOndn6pjVqS6ny56CAt3nsEVT4H" crossorigin="anonymous">
<style>
:root{
  --bg:#07080d;--ink:#f4f5f9;--mute:#aab0c2;--faint:#979db3;
  --glass:rgba(255,255,255,.05);--glass2:rgba(255,255,255,.085);--line:rgba(255,255,255,.09);
  --a:#8b7bff;--b:#3ad6c6;--c:#ff8a6b;--good:#4ade80;--bad:#ff7a7a;--warn:#ffc35c;
  --ease:cubic-bezier(.2,.8,.2,1);--spring:cubic-bezier(.34,1.4,.5,1);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:var(--bg);color:var(--ink);font:15px/1.5 -apple-system,BlinkMacSystemFont,"PingFang SC","SF Pro Text","Helvetica Neue",sans-serif;-webkit-font-smoothing:antialiased}
body{display:grid;place-items:center;overflow:hidden}
button{font:inherit;color:inherit}

/* living background: slow drift, brightens while Lumen works or speaks */
.aurora{position:fixed;inset:-20%;z-index:0;filter:blur(80px) saturate(130%);opacity:.42;transition:opacity 1.2s var(--ease)}
.aurora i{position:absolute;width:46vmax;height:46vmax;border-radius:50%;mix-blend-mode:screen;animation:drift 24s var(--ease) infinite alternate}
.aurora i:nth-child(1){background:radial-gradient(circle,var(--a),transparent 65%);left:5%;top:0}
.aurora i:nth-child(2){background:radial-gradient(circle,var(--b),transparent 65%);right:0;top:25%;animation-duration:30s}
.aurora i:nth-child(3){background:radial-gradient(circle,var(--c),transparent 65%);left:25%;bottom:-5%;animation-duration:36s;opacity:.6}
@keyframes drift{to{transform:translate(8vmax,-6vmax) scale(1.15)}}
body.busy .aurora,body.speaking .aurora{opacity:.62}

.phone{position:relative;z-index:1;width:min(430px,100vw);height:min(920px,100dvh);display:flex;flex-direction:column;
  background:rgba(9,10,16,.66);backdrop-filter:blur(34px);-webkit-backdrop-filter:blur(34px);overflow:hidden}
@media(min-width:520px){.phone{border-radius:46px;border:1px solid var(--line);box-shadow:0 50px 140px rgba(0,0,0,.65),inset 0 1px 0 rgba(255,255,255,.08)}}

.grabber{display:none}
.look{width:46px;height:46px;border-radius:50%;border:1px solid var(--line);background:rgba(255,255,255,.07);color:var(--ink);display:grid;place-items:center;flex:none;cursor:pointer;transition:background .3s,transform .25s var(--spring)}
.look svg{width:21px;height:21px}.look:active{transform:scale(.92)}body.looking .look{background:linear-gradient(135deg,#8b7bff,#3ad6c6);color:#0b0c14;border-color:transparent}
#lookv{position:fixed;inset:0;width:100%;height:100%;object-fit:cover;z-index:0;animation:lookin .7s var(--ease)}
@keyframes lookin{from{opacity:0;transform:scale(1.04)}to{opacity:1;transform:none}}
body.looking::before{content:"";position:fixed;inset:0;z-index:1;pointer-events:none;background:linear-gradient(to bottom,rgba(5,6,10,.62),rgba(5,6,10,0) 22%,rgba(5,6,10,0) 58%,rgba(5,6,10,.78))}
#lookui{position:fixed;left:0;right:0;margin:0 auto;width:max-content;top:calc(max(var(--sat,6px),env(safe-area-inset-top,0px)) + 64px);z-index:4;display:flex;align-items:center;gap:8px;padding:7px 14px;border-radius:99px;background:rgba(10,12,18,.55);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid rgba(255,255,255,.14);color:#fff;font-size:13px;letter-spacing:.01em;animation:lookin .6s var(--ease) .15s both}
#lookui i{width:7px;height:7px;border-radius:50%;background:#3ad6c6;box-shadow:0 0 0 0 rgba(58,214,198,.6);animation:livedot 1.6s ease-out infinite}
@keyframes livedot{to{box-shadow:0 0 0 9px rgba(58,214,198,0)}}
#lookframe{position:fixed;inset:calc(max(var(--sat,6px),env(safe-area-inset-top,0px)) + 112px) 22px 210px;z-index:1;pointer-events:none;animation:lookin .8s var(--ease) .1s both;
  background:linear-gradient(#fff,#fff) top left/26px 2px,linear-gradient(#fff,#fff) top left/2px 26px,linear-gradient(#fff,#fff) top right/26px 2px,linear-gradient(#fff,#fff) top right/2px 26px,
  linear-gradient(#fff,#fff) bottom left/26px 2px,linear-gradient(#fff,#fff) bottom left/2px 26px,linear-gradient(#fff,#fff) bottom right/26px 2px,linear-gradient(#fff,#fff) bottom right/2px 26px;background-repeat:no-repeat;opacity:.75}
body.looking .top .ib,body.looking #setBtn,body.looking .top .conn,body.looking .prof{background:rgba(10,12,18,.45);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}body.looking .top .ib,body.looking #setBtn{border-radius:50%;width:36px;height:36px;display:grid;place-items:center}
body.looking.voice .field{opacity:.55}
@media (prefers-reduced-motion:reduce){#lookv,#lookui,#lookframe{animation:none}#lookui i{animation:none}}
body.looking .aurora,body.looking .welcome{display:none}body.looking .phone{background:transparent}
body.looking .feed{background:linear-gradient(to bottom,transparent 45%,rgba(7,8,13,.85))}
.gbtn{display:block;margin:14px auto 0;width:100%;max-width:360px;padding:14px;border-radius:16px}
.jobs .jrow{display:flex;align-items:center;gap:12px;padding:10px 0;border-top:1px solid var(--line)}.jobs .jrow:first-of-type{border:0}
.jobs .jrow>i{width:9px;height:9px;border-radius:50%;background:linear-gradient(135deg,var(--a),var(--b));flex:none}.jobs .jrow.off>i{background:rgba(255,255,255,.2)}
.jobs .jrow div{flex:1;display:flex;flex-direction:column}.jobs .jrow span{font-size:12.5px;color:var(--mute)}
.sw{width:44px;height:26px;border-radius:99px;border:0;background:rgba(255,255,255,.14);position:relative;flex:none;cursor:pointer;transition:background .3s}
.sw em{position:absolute;left:3px;top:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:transform .35s var(--spring)}
.sw.on{background:linear-gradient(135deg,#8b7bff,#3ad6c6)}.sw.on em{transform:translateX(18px)}
.ajobs .aj{padding:10px 0;border-top:1px solid var(--line)}.ajobs .aj:first-of-type{border:0}
.ajh{display:flex;justify-content:space-between;gap:10px;align-items:baseline}.ajh b{font-size:14.5px;font-weight:560}.ajh .st{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--mute)}.ajh .st.done{color:#3ad6c6}
.ajobs .bar{height:4px;border-radius:4px;background:rgba(255,255,255,.08);margin:8px 0;overflow:hidden}.ajobs .bar i{display:block;height:100%;background:linear-gradient(90deg,#8b7bff,#3ad6c6);transition:width .6s}
.ajp{display:flex;flex-wrap:wrap;gap:6px}.ajp span{font-size:11.5px;padding:3px 8px;border-radius:99px;border:1px solid var(--line);color:var(--faint)}.ajp span.ok{color:var(--ink);border-color:rgba(58,214,198,.4)}.ajp span.now{color:#fff;border-color:rgba(139,123,255,.6);animation:pulse2 1.4s ease-in-out infinite}
@keyframes pulse2{50%{opacity:.55}}
.guard{border-color:rgba(255,138,107,.4);background:linear-gradient(135deg,rgba(255,138,107,.1),transparent)}
.guard p{font-size:14px;color:var(--mute)}.guard blockquote{margin-top:10px;padding:10px 12px;border-left:3px solid #ff8a6b;border-radius:8px;background:rgba(0,0,0,.25);font-size:13px;color:var(--ink);word-break:break-word}
/* settings */
.sgroup{margin:14px 0 4px;border:1px solid var(--line);border-radius:22px;background:rgba(255,255,255,.035);overflow:hidden}
.sgroup h3{font-size:11px;letter-spacing:.12em;color:var(--faint);font-weight:600;padding:14px 16px 4px;text-transform:uppercase}
.srow{display:flex;align-items:center;gap:12px;padding:12px 16px;border-top:1px solid var(--line);min-height:56px}.sgroup h3+.srow{border-top:0}
.srow .dot{width:10px;height:10px;border-radius:50%;flex:none;background:#3ad6c6}.srow .dot.off{background:#ff8a6b}.srow .dot.idle{background:rgba(255,255,255,.25)}
.srow .tx{flex:1;display:flex;flex-direction:column;gap:2px;min-width:0}.srow .tx b{font-size:15px;font-weight:560}.srow .tx span{font-size:12.5px;color:var(--mute)}
.srow .go{border:1px solid var(--line);background:rgba(255,255,255,.08);color:var(--ink);border-radius:99px;padding:8px 14px;font-size:13px;cursor:pointer;flex:none}
.srow .go.p{background:linear-gradient(135deg,#8b7bff,#5d86ff);border-color:transparent}
.srow.click{cursor:pointer}.srow.click:active{background:rgba(255,255,255,.05)}
.rcpt{padding:12px 16px;border-top:1px solid var(--line);cursor:pointer}.rcpt b{font-size:14px;font-weight:560;display:block}.rcpt span{font-size:12px;color:var(--mute)}
.rcpt .more{display:none;margin-top:8px;font-size:12.5px;color:var(--mute);line-height:1.6}.rcpt.open .more{display:block}.rcpt .warn{color:#ff9f86}
.sk-steps{padding:4px 16px 14px;display:none}.srow.open+.sk-steps{display:block}
.sk-step{display:flex;gap:8px;align-items:center;margin:6px 0}.sk-step small{width:58px;color:var(--faint);font-size:11px;text-transform:uppercase;letter-spacing:.08em}
.sk-step input{flex:1;background:rgba(255,255,255,.06);border:1px solid var(--line);border-radius:12px;color:var(--ink);padding:8px 10px;font:14px inherit}
.sk-step button{background:none;border:0;color:var(--faint);font-size:18px;cursor:pointer}
.sk-act{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
body.driving .dock::before{content:"\1F697  " attr(data-drive);position:absolute;top:-30px;left:50%;transform:translateX(-50%);font-size:12px;color:var(--b);white-space:nowrap}
body.driving .words{font-size:30px}
.upd{position:fixed;left:14px;right:14px;top:calc(max(var(--sat,0px),env(safe-area-inset-top,0px),34px) + 10px);z-index:40;display:flex;gap:12px;align-items:center;padding:14px 14px 14px 18px;border-radius:22px;
  background:linear-gradient(135deg,rgba(123,107,255,.28),rgba(58,214,198,.18)),rgba(13,14,22,.92);border:1px solid rgba(255,255,255,.12);box-shadow:0 18px 50px rgba(0,0,0,.45);
  transform:translateY(-140%);opacity:0;transition:transform .7s cubic-bezier(.2,.9,.25,1),opacity .5s;overflow:hidden}
.upd.on{transform:none;opacity:1}.upd-i{flex:1;display:flex;flex-direction:column;gap:2px}.upd-i b{font-size:15px}.upd-i span{font-size:12.5px;color:var(--mute)}
.upd-bar{position:absolute;left:0;bottom:0;height:3px;width:0;background:linear-gradient(90deg,#7b6bff,#3ad6c6);transition:width .3s}
/* the assistant panel over another app: a glass sheet at the bottom, orb centred, the newest answer only */
html.overlay,html.overlay body{background:transparent!important;height:auto;min-height:0;overflow:hidden}
html.overlay .aurora,html.overlay .top,html.overlay .welcome,html.overlay .turn.past,html.overlay .field,html.overlay .stage .end{display:none!important}
html.overlay .phone{position:fixed;left:0;right:0;bottom:0;height:auto;max-height:none;display:flex;flex-direction:column;
  background:#0d0e16;border-radius:30px 30px 0 0;max-height:var(--panelMax,78vh);box-shadow:0 -18px 60px rgba(0,0,0,.45);border-top:1px solid rgba(255,255,255,.08);
  animation:sheetup .55s cubic-bezier(.2,.9,.25,1) both}
html.overlay .grabber{display:block;width:42px;height:5px;border-radius:9px;background:rgba(255,255,255,.22);margin:10px auto 2px;cursor:pointer}
html.overlay .feed{flex:0 1 auto;min-height:0;overflow-y:auto;overscroll-behavior:contain;padding:4px 16px 0}
html.overlay .dock{background:#0d0e16;position:relative;z-index:3;flex:none}html.overlay .stage,html.overlay .grabber{flex:none} /* only the answer scrolls; the caption and buttons keep their room */
html.overlay .turn .ask{display:none}
html.overlay .turn,html.overlay body.voice .turn{padding-bottom:6px!important;min-height:0}
html.overlay .stage{position:relative!important;inset:auto!important;opacity:1;transform:none;visibility:visible;padding:4px 22px 0;min-height:0;text-align:center;pointer-events:none}
html.overlay .words{font-size:22px;line-height:1.3}
html.overlay .stage{background:none!important;border:0!important;box-shadow:none!important;backdrop-filter:none!important}
html.overlay body:not(.voice) .stage{display:none}
html.overlay .sheet,html.overlay .veil,html.overlay .toast:empty{display:none!important}
html.overlay .gate{position:relative;inset:auto;min-height:0;padding:18px 0 26px}html.overlay .gate canvas{width:72px;height:72px;margin:0}html.overlay .gate h1{font-size:22px}html.overlay .gate p{margin:4px 0 14px}
html.overlay .dock{justify-content:center;padding:6px 0 calc(14px + env(safe-area-inset-bottom))}
html.overlay .orbwrap,html.overlay body.voice .orbwrap{transform:scale(1.25)}
@keyframes sheetup{from{transform:translateY(100%);opacity:.4}to{transform:none;opacity:1}}
.top{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:calc(max(var(--sat,6px),env(safe-area-inset-top,0px)) + 14px) 18px 6px;position:relative;z-index:3}
.top>*{min-width:0}.top .brand{min-width:0;flex-shrink:1}
html,body{max-width:100%;overflow-x:clip}
.conn span{overflow:hidden;text-overflow:ellipsis}
@media (max-width:390px){.top{padding-left:14px;padding-right:14px;gap:6px}.conn span{display:none}.conn{padding:9px}.prof button{padding:5px 9px}.dock{padding-left:10px;padding-right:10px;gap:8px}.dock .orbwrap{width:50px;height:50px}.dock .look{width:42px;height:42px}}
.dock .field{min-width:0}
.brand{display:flex;align-items:center;gap:10px;font-weight:600;letter-spacing:.02em}
.mark{width:20px;height:20px;border-radius:50%;background:conic-gradient(from 0deg,var(--a),var(--b),var(--c),var(--a));animation:spin 9s linear infinite}
body.busy .mark{animation-duration:1.4s}
@keyframes spin{to{transform:rotate(1turn)}}
.clock{color:var(--mute);font-variant-numeric:tabular-nums;font-size:13px}
.reset{background:none;border:0;color:var(--faint);font-size:13px;cursor:pointer}

/* feed: each turn is its own screen */
.feed{flex:1;overflow-y:auto;padding:0 18px;scroll-behavior:smooth;scrollbar-width:none;position:relative;z-index:2}
.feed::-webkit-scrollbar{display:none}
.turn{min-height:100%;padding:10px 0 150px;transition:opacity .8s var(--ease),filter .8s var(--ease)}
.turn.past{opacity:.38;filter:saturate(.6)}
.turn.past:hover{opacity:.8}
.ask{display:flex;justify-content:flex-end}
.ask span{max-width:86%;padding:9px 15px;border-radius:20px 20px 6px 20px;background:var(--glass2);border:1px solid var(--line);font-size:14px;color:var(--mute);animation:rise .55s var(--ease) both}
.canvas{padding-top:14px;display:flex;flex-direction:column;gap:12px}

@keyframes rise{from{opacity:0;transform:translateY(16px) scale(.985);filter:blur(8px)}}
@keyframes fade{from{opacity:0}}
.stagger>*{animation:rise .65s var(--ease) both}
.stagger>*:nth-child(2){animation-delay:.07s}.stagger>*:nth-child(3){animation-delay:.14s}.stagger>*:nth-child(4){animation-delay:.21s}
.stagger>*:nth-child(5){animation-delay:.28s}.stagger>*:nth-child(6){animation-delay:.35s}.stagger>*:nth-child(n+7){animation-delay:.42s}

.k{background:var(--glass);border:1px solid var(--line);border-radius:24px;padding:16px;animation:rise .75s var(--ease) both;position:relative;overflow:hidden}
.k .lbl{font-size:12px;font-weight:600;color:var(--mute);letter-spacing:.08em;margin-bottom:12px}

/* hero: letters settle in one by one */
.hero{padding:4px 4px 2px;order:-2}
.hero h2{font-size:28px;line-height:1.2;font-weight:650;letter-spacing:-.02em;color:#fff}
.hero h2 span:not(.wd),.welcome h1 span:not(.wd),.person h2 span:not(.wd),.stage .words span:not(.wd){display:inline-block;animation:letter .7s var(--ease) both;white-space:pre}
.wd{display:inline-block;white-space:nowrap}
.wd[style]{animation:letter .7s var(--ease) both}
.hero h2,.answer,.k .lbl,.tx b,.tx span,.li b{unicode-bidi:plaintext}
.hero h2{overflow-wrap:anywhere}
th{white-space:nowrap}
@keyframes letter{from{opacity:0;transform:translateY(.35em);filter:blur(6px)}}
.hero p{color:var(--mute);margin-top:6px;animation:rise .8s .25s var(--ease) both}

.answer{font-size:16px;line-height:1.7;color:#e3e5ee;padding:0 4px;animation:rise .8s var(--ease) both}
.answer b{color:#fff;font-weight:600}

.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(112px,1fr));gap:10px}
.stat{background:var(--glass);border:1px solid var(--line);border-radius:20px;padding:12px 14px}
.stat b{display:block;font-size:23px;font-weight:650;letter-spacing:-.01em;font-variant-numeric:tabular-nums}
.stat span{font-size:12px;color:var(--mute)}
.stat em{font-style:normal;font-size:12px;margin-left:6px;font-weight:500}
.good{color:var(--good)}.bad{color:var(--bad)}.neutral{color:var(--mute)}

.tl{position:relative;padding-left:18px}
.tl:before{content:"";position:absolute;left:5px;top:6px;bottom:6px;width:2px;border-radius:2px;background:linear-gradient(var(--a),var(--b));transform-origin:top;animation:draw 1.1s var(--ease) both}
@keyframes draw{from{transform:scaleY(0)}}
.ev{position:relative;padding:3px 0 14px 12px}
.ev:last-child{padding-bottom:0}
.ev:before{content:"";position:absolute;left:-17px;top:8px;width:10px;height:10px;border-radius:50%;background:var(--bg);border:2px solid var(--a)}
.ev.warn:before{border-color:var(--warn);background:var(--warn)}
.ev.done{opacity:.5}
.ev time{font-size:12px;color:var(--mute);font-variant-numeric:tabular-nums}
.ev b{display:block;font-weight:600}
.ev small{color:var(--faint)}
.ev.warn small{color:var(--warn)}

.cardlist{display:flex;flex-direction:column;gap:8px}
.card{display:flex;gap:12px;align-items:center;padding:12px;border-radius:18px;background:rgba(255,255,255,.035);border:1px solid transparent;transition:.3s var(--ease)}
.card:hover{border-color:var(--line);background:rgba(255,255,255,.06)}
.card.warn{border-color:rgba(255,195,92,.3)}
.av{flex:none;width:38px;height:38px;border-radius:13px;display:grid;place-items:center;font-weight:700;color:#0b0b12;background:linear-gradient(135deg,var(--a),var(--b))}
.tx{flex:1;min-width:0}
.tx b{display:block;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tx span{display:block;font-size:13px;color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.badge{font-size:11px;padding:3px 8px;border-radius:99px;background:rgba(255,195,92,.14);color:var(--warn);white-space:nowrap}
.mini{flex:none;border:1px solid var(--line);background:rgba(255,255,255,.06);border-radius:99px;padding:6px 12px;font-size:12px;cursor:pointer;transition:.25s var(--ease)}
.mini:hover{background:rgba(255,255,255,.14)}

.list{display:flex;flex-direction:column}
.li{display:flex;gap:12px;align-items:flex-start;padding:10px 0;border-top:1px solid var(--line)}
.li:first-child{border-top:0;padding-top:0}
.li i{flex:none;width:26px;height:26px;border-radius:9px;display:grid;place-items:center;font-style:normal;font-size:12px;font-weight:700;background:var(--glass2);color:var(--b)}
.li b{display:block;font-weight:600}
.li span{font-size:13px;color:var(--mute)}

table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;color:var(--mute);font-weight:500;padding:0 8px 8px 0}
td{padding:9px 8px 9px 0;border-top:1px solid var(--line);font-variant-numeric:tabular-nums}
tr{animation:fade .6s var(--ease) both}

.donut{display:flex;align-items:center;gap:18px}
.donut .ring{position:relative;flex:none;width:136px;height:136px}
.donut svg{width:136px;height:136px;transform:rotate(-90deg)}
.donut circle{fill:none;stroke-width:15;transition:stroke-dasharray 1.3s var(--ease)}
.donut .ctr{position:absolute;inset:0;display:grid;place-items:center;font-weight:650;font-size:18px}
.legend{display:flex;flex-direction:column;gap:6px;font-size:13px;flex:1}
.legend div{display:flex;align-items:center;gap:8px}
.legend i{width:8px;height:8px;border-radius:3px;flex:none}
.legend span{flex:1;color:var(--mute)}
.legend b{font-weight:600;font-variant-numeric:tabular-nums}

.bars{display:flex;flex-direction:column;gap:10px}
.bar{display:grid;grid-template-columns:70px 1fr auto;gap:10px;align-items:center;font-size:13px}
.bar span{color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.track{height:10px;border-radius:99px;background:rgba(255,255,255,.06);overflow:hidden}
.fill{height:100%;border-radius:99px;background:linear-gradient(90deg,var(--a),var(--b));width:0;transition:width 1.2s var(--ease)}

.wx{display:flex;justify-content:space-between;align-items:flex-start}
.wx .t{font-size:60px;font-weight:250;line-height:1;letter-spacing:-.04em}
.wx .c{color:var(--mute);text-align:right;font-size:13px}
.wx .c b{display:block;color:var(--ink);font-size:18px;font-weight:600}
.days{display:grid;grid-template-columns:repeat(6,1fr);gap:5px;margin-top:16px;text-align:center;font-size:11px}
.days div{padding:8px 0;border-radius:13px;background:rgba(255,255,255,.04);color:var(--mute)}
.days b{display:block;font-size:14px;color:var(--ink);margin:3px 0 1px}
.days small{display:block;color:var(--b);margin-top:2px}

/* person: photo first, words below it (never on the image) */
.person{padding:0}
.person .ph{position:relative;height:290px;overflow:hidden;background:#111}
.person .ph img{width:100%;height:100%;object-fit:cover;object-position:50% 20%;opacity:0;transform:scale(1.12);filter:blur(14px);transition:opacity 1s var(--ease),transform 7s var(--ease),filter 1s var(--ease)}
.person .ph img.in{opacity:1;transform:scale(1);filter:none}
.person .body{padding:16px}
.person h2{font-size:24px;font-weight:650;letter-spacing:-.02em}
.person .desc{color:var(--b);font-size:13px;margin-top:2px}
.person .sum{color:#d6d9e3;font-size:14px;line-height:1.65;margin-top:10px;display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden;cursor:pointer}
.person .sum.open{-webkit-line-clamp:unset}
.facts{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:14px}
.facts div{background:rgba(255,255,255,.04);border-radius:14px;padding:9px 11px}
.facts span{display:block;font-size:11px;color:var(--faint)}
.facts b{display:block;font-size:13px;font-weight:600;margin-top:1px}

.map{padding:0}
.map .m{height:230px;background:#0d0f16}
.map .cap{padding:12px 16px 14px}
.map .cap b{display:block;font-weight:600}
.map .cap span{font-size:12px;color:var(--mute)}
.leaflet-container{background:#0d0f16;font:inherit}
.pin{width:16px;height:16px;border-radius:50%;background:var(--b);border:3px solid #fff;box-shadow:0 2px 10px rgba(0,0,0,.5)}

.quote .px{display:flex;align-items:baseline;gap:10px;margin-top:2px}
.quote .px b{font-size:34px;font-weight:650;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.quote .nm{font-size:13px;color:var(--mute)}
.quote svg{width:100%;height:96px;margin-top:10px;overflow:visible}
.quote .ln{fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round;transition:stroke-dashoffset 1.6s var(--ease)}
.quote .ar{transition:opacity 1.4s .6s var(--ease)}
.quote .rg{display:flex;justify-content:space-between;font-size:12px;color:var(--faint);margin-top:6px}

.flights .route{display:flex;align-items:center;gap:12px;margin-bottom:14px}
.flights .route b{font-size:24px;font-weight:650;letter-spacing:.02em}
.flights .route .arc{flex:1;height:2px;background:linear-gradient(90deg,var(--a),var(--b));border-radius:2px;position:relative;transform-origin:left;animation:draw-x 1s var(--ease) both}
@keyframes draw-x{from{transform:scaleX(0)}}
.flights .route span{font-size:12px;color:var(--mute)}
.fl{display:grid;grid-template-columns:1fr auto;gap:4px 12px;padding:13px 14px;border-radius:18px;background:rgba(255,255,255,.035);border:1px solid transparent;transition:.3s var(--ease)}
.fl:hover{border-color:var(--line)}
.fl.best{border-color:rgba(58,214,198,.35);background:rgba(58,214,198,.06)}
.fl .tm{font-size:19px;font-weight:600;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.fl .tm small{font-size:11px;color:var(--warn);vertical-align:super;margin-left:1px}
.fl .pr{font-size:19px;font-weight:650;text-align:right;font-variant-numeric:tabular-nums}
.fl .al{font-size:12px;color:var(--mute)}
.fl .st{font-size:12px;color:var(--mute);text-align:right}
.fl .tag{font-size:11px;color:var(--b);margin-left:6px}
.fls{display:flex;flex-direction:column;gap:8px}

.sources{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding:2px 2px 4px}
.sources::-webkit-scrollbar{display:none}
.src{flex:none;display:flex;align-items:center;gap:8px;max-width:210px;padding:8px 12px;border-radius:14px;background:var(--glass);border:1px solid var(--line);font-size:12px;color:var(--mute);text-decoration:none;transition:.25s var(--ease)}
.src:hover{background:var(--glass2);color:var(--ink)}
.src img{width:16px;height:16px;border-radius:4px;flex:none}
.src span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.compose label{display:block;font-size:12px;color:var(--mute);margin:8px 0 4px}
.compose input,.compose textarea{width:100%;background:rgba(0,0,0,.25);border:1px solid var(--line);border-radius:13px;color:var(--ink);font:inherit;padding:9px 11px;outline:none;transition:border .2s}
.compose input:focus,.compose textarea:focus{border-color:var(--a)}
.compose textarea{min-height:110px;resize:vertical}

.actions{display:flex;flex-wrap:wrap;gap:8px}
.btn{border:1px solid var(--line);background:rgba(255,255,255,.07);border-radius:99px;padding:10px 17px;font-size:14px;cursor:pointer;transition:transform .25s var(--spring),background .25s}
.btn:hover{background:rgba(255,255,255,.14)}.btn:active{transform:scale(.95)}
.btn.p{background:linear-gradient(135deg,#7b6bff,#5d86ff);border-color:transparent;box-shadow:0 8px 22px rgba(0,0,0,.35)}
.btn:disabled,.mini:disabled{opacity:.4;pointer-events:none}

.done{display:flex;gap:12px;align-items:center}
.done svg{flex:none;width:34px;height:34px}
.done circle{fill:rgba(74,222,128,.13);stroke:var(--good);stroke-width:2}
.done path{fill:none;stroke:var(--good);stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:24;stroke-dashoffset:24;animation:tick .6s .2s var(--ease) forwards}
@keyframes tick{to{stroke-dashoffset:0}}
.note{color:var(--mute);padding:0 4px;animation:rise .6s var(--ease) both}

/* waiting: the acknowledgement line plus a soft placeholder */
.wait{order:-1;display:flex;flex-direction:column;gap:12px}
.wait p{color:var(--mute);font-size:14px;padding:0 4px;animation:rise .5s var(--ease) both;min-height:1.5em}
.skel{height:84px;border-radius:24px;background:linear-gradient(100deg,rgba(255,255,255,.025) 30%,rgba(255,255,255,.075) 50%,rgba(255,255,255,.025) 70%);background-size:300% 100%;animation:shimmer 1.5s linear infinite}
@keyframes shimmer{from{background-position:100% 0}to{background-position:0 0}}

/* welcome */
.welcome{padding:34px 4px 140px}
.welcome h1{font-size:34px;line-height:1.14;font-weight:650;letter-spacing:-.03em}
.welcome h1 em{font-style:normal;color:#b9b0ff}
.welcome p{color:var(--mute);margin:10px 0 24px;animation:rise .9s .2s var(--ease) both}
.chips{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.chip{text-align:left;border:1px solid var(--line);background:var(--glass);border-radius:20px;padding:13px 14px;cursor:pointer;transition:.35s var(--ease);animation:rise .7s var(--ease) both;font-size:14px;line-height:1.35}
.chip small{display:block;color:var(--faint);font-size:11px;margin-top:6px;letter-spacing:.04em}
.chip:hover{background:var(--glass2);transform:translateY(-2px)}

/* caption stage: what you say and what Lumen says, large, in front */
.stage{position:absolute;left:12px;right:12px;bottom:86px;z-index:4;padding:14px 16px 14px;pointer-events:none;border-radius:22px;
  background:rgba(16,18,28,.94);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border:1px solid var(--line);box-shadow:0 18px 40px rgba(0,0,0,.45);opacity:0;transform:translateY(14px) scale(.98);transition:opacity .45s var(--ease),transform .45s var(--spring)}
body.voice .turn,body.voice .welcome{padding-bottom:260px}
body.voice .stage{opacity:1;transform:none}
.stage{visibility:hidden}
body.voice .stage{visibility:visible}
.stage .who{font-size:11px;letter-spacing:.14em;color:var(--faint);margin-bottom:6px;transition:color .4s;padding-right:120px}
.stage .words{font-size:19px;line-height:1.4;font-weight:600;letter-spacing:-.01em;min-height:1.4em;color:#fff;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.stage .words span:not(.wd){display:inline-block;white-space:pre;animation:letter .45s var(--ease) both}
.stage .words .ghost{color:var(--faint)}
body.listening .stage .who{color:var(--b)}
body.speaking .stage .who{color:#b9b0ff}

/* input + orb (bottom-right) */
.dock{position:relative;z-index:5;padding:10px 14px calc(16px + max(var(--sab,0px),env(safe-area-inset-bottom,0px)));display:flex;gap:10px;align-items:center}
.field{flex:1;display:flex;align-items:center;background:rgba(255,255,255,.07);border:1px solid var(--line);border-radius:99px;padding:4px 4px 4px 18px;transition:border .25s,box-shadow .25s,opacity .5s var(--ease),transform .5s var(--ease)}
.field:focus-within{border-color:rgba(139,123,255,.55);box-shadow:0 0 0 4px rgba(139,123,255,.1)}
.field input{flex:1;min-width:0;background:none;border:0;outline:0;color:var(--ink);font:inherit;padding:9px 0}
.send{width:38px;height:38px;border-radius:50%;border:0;display:grid;place-items:center;cursor:pointer;background:var(--glass2);transition:transform .25s var(--spring),background .3s}
.send:hover{background:rgba(255,255,255,.16)}.send:active{transform:scale(.88)}
.send svg{width:17px;height:17px}
body.voice .field{opacity:.25;transform:scale(.97)}
.orbwrap{position:relative;flex:none;width:58px;height:58px;cursor:pointer;transition:transform .5s var(--spring)}
body.voice .orbwrap{transform:scale(1.16)}
.orbwrap canvas{width:100%;height:100%;display:block}
.orbwrap .mic{position:absolute;inset:0;display:grid;place-items:center;pointer-events:none;transition:opacity .4s}
.orbwrap .mic svg{width:20px;height:20px;color:#fff;filter:drop-shadow(0 1px 2px rgba(0,0,0,.5))}
body.voice .orbwrap .mic{opacity:0}
.end{position:absolute;top:9px;right:10px;z-index:1;border:1px solid var(--line);background:rgba(255,255,255,.06);border-radius:99px;padding:5px 12px;font-size:12px;color:var(--mute);cursor:pointer;pointer-events:auto}


/* connect cards */
.conns{display:flex;flex-direction:column;gap:8px}
.cn{display:grid;grid-template-columns:44px 1fr auto;gap:12px;align-items:center;padding:12px;border-radius:20px;background:rgba(255,255,255,.035);border:1px solid var(--line);transition:border-color .5s var(--ease),background .5s var(--ease)}
.cn .ic{width:44px;height:44px;border-radius:14px;background:#fff;display:grid;place-items:center;overflow:hidden}
.cn .ic img{width:26px;height:26px}
.cn b{display:block;font-weight:600}
.cn span{display:block;font-size:12px;color:var(--mute)}
.cn em{font-style:normal;font-size:11px;color:var(--faint)}
.cn.ok{border-color:rgba(74,222,128,.4);background:rgba(74,222,128,.06)}
.cn.ok .btn{background:transparent;border-color:transparent;color:var(--good)}
.cn .btn{padding:8px 14px;font-size:13px}
/* custom interfaces the agent builds */
.html{padding:0;overflow:hidden}
.html .lbl{padding:14px 16px 0;margin:0}
.html iframe{display:block;width:100%;border:0;background:transparent;color-scheme:normal;transition:height .5s var(--ease)}
.toast{position:absolute;left:50%;top:64px;z-index:7;transform:translate(-50%,-10px);opacity:0;background:rgba(20,22,32,.92);border:1px solid var(--line);border-radius:99px;padding:7px 14px;font-size:12px;color:var(--mute);transition:.45s var(--ease);pointer-events:none}
.toast.on{opacity:1;transform:translate(-50%,0)}
body.light{--ink:#14151b;--mute:#555b6e;--faint:#6b7083;--glass:rgba(0,0,0,.04);--glass2:rgba(0,0,0,.07);--line:rgba(0,0,0,.09)}
body.light .phone{background:rgba(250,250,252,.82)}
body.light .hero h2,body.light .stage .words,body.light .answer b{color:#0c0d12}
body.light .answer{color:#2a2d38}
body.light .stage{background:linear-gradient(to top,rgba(250,250,252,.97) 35%,rgba(250,250,252,0))}
body.serif .hero h2,body.serif .answer,body.serif .welcome h1{font-family:"Songti SC","Noto Serif SC",Georgia,serif;font-weight:600}
body.rounded{--radius-k:30px}

/* sign-in */
.gate{position:absolute;inset:0;z-index:20;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:30px 26px;text-align:center;animation:fade .8s var(--ease)}
.gate[hidden]{display:none}
.gate canvas{width:150px;height:150px;margin-bottom:10px}
.gate h1{font-size:34px;font-weight:650;letter-spacing:-.02em}
.gate p{color:var(--mute);margin:8px 0 26px}
#signin{width:100%;max-width:360px;min-height:220px}
/* memory sheet */
.memtext{color:#d9dce6;font-size:14px;line-height:1.65;background:var(--glass);border:1px solid var(--line);border-radius:16px;padding:12px 14px}
.facts2{display:flex;flex-direction:column;gap:6px}
.fact{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:14px;background:var(--glass);border:1px solid var(--line);font-size:14px;animation:rise .5s var(--ease) both}
.fact span{flex:1}
.fact button{border:0;background:none;color:var(--faint);font-size:18px;line-height:1;cursor:pointer;padding:0 2px}
.fact button:hover{color:var(--bad)}

/* connect something new: one field, generated cards */
.find{display:flex;align-items:center;gap:10px;background:rgba(0,0,0,.3);border:1px solid var(--line);border-radius:16px;padding:0 14px;transition:border .25s,box-shadow .25s}
.find:focus-within{border-color:rgba(139,123,255,.55);box-shadow:0 0 0 4px rgba(139,123,255,.1)}
.find svg{flex:none;width:17px;height:17px;color:var(--faint)}
.find input{flex:1;min-width:0;background:none;border:0;outline:0;color:var(--ink);font:inherit;font-size:15px;padding:13px 0}
#found{margin-top:10px}
#found .k{animation:rise .6s var(--ease) both}
#found .sub{padding:4px 2px}

/* profiles */
.bname{display:none}
.prof{position:relative;display:flex;background:var(--glass);border:1px solid var(--line);border-radius:99px;padding:2px}
.prof button{position:relative;z-index:1;border:0;background:none;font-size:12px;color:var(--mute);padding:5px 11px;border-radius:99px;cursor:pointer;transition:color .4s var(--ease)}
.prof button.on{color:var(--ink)}
.prof i{position:absolute;top:2px;bottom:2px;left:2px;border-radius:99px;background:var(--glass2);border:1px solid var(--line);transition:transform .55s var(--spring),width .55s var(--spring)}
body.business{--a:#6aa8ff;--b:#9ad0c2;--c:#c9b37e}
.phone.switching .feed{animation:swap .7s var(--ease)}
@keyframes swap{40%{opacity:0;transform:translateX(-18px);filter:blur(6px)}41%{transform:translateX(18px)}}
/* one screen: long cards fold, a tap opens them */
.k.fold{max-height:300px}
.k.fold::after{content:"";position:absolute;left:0;right:0;bottom:34px;height:50px;background:linear-gradient(to top,rgba(14,15,22,.96),rgba(14,15,22,0));pointer-events:none}
.k .morebtn{position:absolute;z-index:2;left:0;right:0;bottom:0;border:0;border-top:1px solid var(--line);background:rgba(20,22,32,.97);color:var(--mute);border-radius:0;padding:9px 0;font-size:12px;cursor:pointer;letter-spacing:.04em}
.k.open{max-height:none!important}.k.open::after{display:none}.k.open .morebtn{position:static;transform:none;display:block;margin:12px auto 0}
.person{padding:16px}
.person .phead{display:flex;gap:14px;align-items:center}
.person .ph{flex:none;width:84px;height:84px;border-radius:22px;overflow:hidden;background:#111}
.person .body{padding:0}
.person h2{font-size:21px}
.person .sum{-webkit-line-clamp:3}
/* choices + forms + key cards */
.choices{display:flex;flex-wrap:wrap;gap:8px}
.choices p{width:100%;color:var(--mute);font-size:14px;margin-bottom:2px}
.choice{border:1px solid var(--line);background:var(--glass);border-radius:16px;padding:10px 14px;font-size:14px;cursor:pointer;transition:transform .25s var(--spring),background .25s,border-color .25s}
.choice:hover{background:var(--glass2);border-color:rgba(139,123,255,.5)}.choice:active{transform:scale(.95)}
.fform{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.fform label{display:flex;flex-direction:column;gap:5px;font-size:12px;color:var(--mute)}
.fform label.w{grid-column:1/-1}
.fform input,.fform select{background:rgba(0,0,0,.28);border:1px solid var(--line);border-radius:12px;color:var(--ink);font:inherit;font-size:14px;padding:9px 11px;outline:none;transition:border .2s}
.fform input:focus,.fform select:focus{border-color:var(--a)}
.fchips{display:flex;flex-wrap:wrap;gap:6px}
.fchips button{border:1px solid var(--line);background:var(--glass);border-radius:99px;padding:6px 11px;font-size:13px;color:var(--ink);cursor:pointer;transition:.2s}
.fchips button.on{background:rgba(139,123,255,.22);border-color:rgba(139,123,255,.6)}
.tog{display:flex;align-items:center;gap:10px;color:var(--ink);font-size:14px}
.tog input{width:40px;height:22px;accent-color:var(--a)}
.akey .top{display:flex;gap:12px;align-items:center;margin-bottom:12px}
.akey .ic{width:44px;height:44px;border-radius:14px;background:#fff;display:grid;place-items:center;flex:none}
.akey .ic img{width:26px;height:26px}
.akey b{display:block;font-weight:600}.akey span{font-size:13px;color:var(--mute)}
.akey .hint{font-size:13px;color:var(--mute);margin:2px 0 10px}
.akey .row{display:flex;gap:8px}
.akey input{flex:1;min-width:0;background:rgba(0,0,0,.28);border:1px solid var(--line);border-radius:12px;color:var(--ink);font:inherit;padding:10px 12px;outline:none}
.akey small{display:block;color:var(--faint);font-size:11px;margin-top:8px}
.akey a{color:var(--b);font-size:13px;text-decoration:none}
.akey .dest{display:block;font-style:normal;font-size:11px;color:var(--faint);margin-top:2px}
.akey .warn{color:var(--warn);font-size:12px;margin:0 0 6px}
.akey.ok{border-color:rgba(74,222,128,.4)}
/* voice picker */
.voices{display:flex;flex-direction:column;gap:6px;max-height:260px;overflow-y:auto;scrollbar-width:none}
.vrow{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:14px;background:var(--glass);border:1px solid var(--line);cursor:pointer;text-align:start;font-size:14px;color:var(--ink)}
.vrow small{display:block;color:var(--faint);font-size:11px}
.vrow.on{border-color:rgba(139,123,255,.55);background:rgba(139,123,255,.1)}
.vrow .pl{flex:none;width:26px;height:26px;border-radius:50%;display:grid;place-items:center;background:var(--glass2)}
.vrow.playing .pl{background:var(--a)}

.rm{border:0;background:none;color:var(--faint);font-size:11px;cursor:pointer}.rm:hover{color:var(--bad)}
/* route */
.route .m{height:210px}
.rinfo{display:flex;align-items:baseline;gap:10px;padding:12px 16px 2px}
.rinfo b{font-size:26px;font-weight:650;letter-spacing:-.02em}
.rinfo span{color:var(--mute);font-size:14px}
.route small{display:block;padding:0 16px 14px;color:var(--faint);font-size:11px}
.leaflet-tile-pane{filter:invert(1) hue-rotate(180deg) brightness(.82) contrast(.92) saturate(.55)}
body.light .leaflet-tile-pane{filter:none}
.leaflet-control-attribution{background:rgba(10,11,18,.6)!important;color:var(--faint)!important;font-size:9px!important}
.leaflet-control-attribution a{color:var(--faint)!important}
.rpath{stroke-dasharray:2400;stroke-dashoffset:2400;animation:rdraw 1.8s .5s var(--ease) forwards}
@keyframes rdraw{to{stroke-dashoffset:0}}
.dot{width:14px;height:14px;border-radius:50%;border:3px solid #fff;box-shadow:0 2px 8px rgba(0,0,0,.5)}
/* position on a quote + portfolio */
.pos{margin-top:12px;padding:12px 14px;border-radius:16px;background:rgba(255,255,255,.04);display:flex;justify-content:space-between;align-items:center;gap:10px}
.pos b{display:block;font-size:18px;font-variant-numeric:tabular-nums}
.pos span{font-size:12px;color:var(--mute)}
.pos .actions{flex:none}
.pf-top{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:10px}
.pf-top b{font-size:28px;font-weight:650;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.pf-row{display:grid;grid-template-columns:1fr auto auto;gap:12px;align-items:center;padding:9px 0;border-top:1px solid var(--line);font-size:14px;font-variant-numeric:tabular-nums}
.pf-row small{display:block;color:var(--faint);font-size:11px}
/* trip dashboard */
.trip h3{font-size:30px;font-weight:650;letter-spacing:-.02em;line-height:1.1}
.trip .when{color:var(--mute);font-size:13px;margin-top:4px}
.wstrip{display:flex;gap:6px;margin:14px 0;overflow:hidden}
.wstrip div{flex:1;min-width:0;text-align:center;padding:7px 0;border-radius:12px;background:rgba(255,255,255,.04);font-size:11px;color:var(--mute)}
.wstrip b{display:block;color:var(--ink);font-size:14px;margin-top:2px}
.trow{display:flex;align-items:center;gap:12px;padding:10px 0;border-top:1px solid var(--line)}
.trow i{flex:none;width:30px;height:30px;border-radius:10px;display:grid;place-items:center;background:var(--glass2);font-style:normal;font-size:14px}
.trow div{flex:1;min-width:0}
.trow b{display:block;font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.trow span{font-size:12px;color:var(--mute)}
.ring{flex:none;width:34px;height:34px}
.ring circle{fill:none;stroke-width:4}
/* seat map */
.cabin{display:flex;flex-direction:column;gap:3px;align-items:center;padding:6px 0}
.srow{display:flex;gap:4px;align-items:center}
.srow em{width:20px;font-style:normal;font-size:10px;color:var(--faint);text-align:center}
.seat{width:28px;height:22px;border-radius:8px 8px 5px 5px;border:1px solid var(--line);background:rgba(255,255,255,.05);font-size:9px;color:var(--mute);cursor:pointer;padding:0;transition:transform .2s var(--spring),background .2s}
.seat:active{transform:scale(.9)}
.seat.taken{background:rgba(255,255,255,.02);border-color:transparent;color:transparent;cursor:default;opacity:.35}
.seat.paid{border-color:rgba(255,195,92,.5);color:var(--warn)}
.seat.first{width:38px}
.seat.sug{background:rgba(58,214,198,.22);border-color:var(--b);color:var(--ink)}
.seat.pick{background:var(--a);border-color:var(--a);color:#fff;transform:scale(1.08)}
.aisle-gap{width:14px}
.legend2{display:flex;flex-wrap:wrap;gap:10px;font-size:11px;color:var(--mute);margin:8px 0}
.legend2 i{display:inline-block;width:12px;height:12px;border-radius:4px;vertical-align:-2px;margin-right:4px;border:1px solid var(--line)}
.seatbar{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:8px;padding:10px 12px;border-radius:14px;background:rgba(255,255,255,.05);min-height:52px}
.seatbar b{font-size:16px}.seatbar span{font-size:12px;color:var(--mute)}
/* boarding pass */
.bp{padding:0;overflow:hidden}
.bp .band{display:flex;justify-content:space-between;align-items:center;padding:14px 18px;background:linear-gradient(120deg,rgba(139,123,255,.35),rgba(58,214,198,.25))}
.bp .band b{font-size:15px}.bp .band span{font-size:12px;color:var(--mute)}
.bp .od{display:flex;align-items:center;justify-content:space-between;padding:16px 18px 6px}
.bp .od b{font-size:40px;font-weight:650;letter-spacing:.02em}
.bp .od span{display:block;font-size:12px;color:var(--mute)}
.bp .od i{flex:1;height:1px;margin:0 14px;background:repeating-linear-gradient(90deg,var(--faint) 0 6px,transparent 6px 12px);position:relative}
.bp .grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;padding:8px 18px 14px}
.bp .grid4 span{display:block;font-size:10px;color:var(--faint);letter-spacing:.08em}
.bp .grid4 b{font-size:18px}
.bp .tear{height:18px;margin:0 -1px;background:radial-gradient(circle at 0 50%,var(--bg) 9px,transparent 10px),radial-gradient(circle at 100% 50%,var(--bg) 9px,transparent 10px);border-top:1px dashed var(--line)}
.bp svg{display:block;width:calc(100% - 36px);height:54px;margin:4px 18px 16px}
/* checklist */
.cl{display:flex;flex-direction:column}
.ci{display:flex;align-items:center;gap:12px;padding:9px 2px;border-top:1px solid var(--line);cursor:pointer;font-size:14px;text-align:start;background:none;border-left:0;border-right:0;border-bottom:0;color:var(--ink);width:100%}
.ci:first-child{border-top:0}
.ci i{flex:none;width:22px;height:22px;border-radius:50%;border:2px solid var(--faint);display:grid;place-items:center;transition:.3s var(--spring)}
.ci.on i{background:var(--good);border-color:var(--good)}
.ci.on i::after{content:"";width:9px;height:5px;border-left:2px solid #0b0b12;border-bottom:2px solid #0b0b12;transform:rotate(-45deg) translate(1px,-1px)}
.ci.on span{color:var(--faint);text-decoration:line-through}
.clp{font-size:12px;color:var(--mute);float:right}
/* top bar icon buttons */
.ib{display:grid;place-items:center;width:30px;height:30px}

/* confirmation */
.cf{border-color:rgba(255,195,92,.35)}
.cf .cft{display:block;font-size:20px;font-weight:650;margin:2px 0 10px}
.cfr{display:flex;flex-direction:column;gap:6px;margin-bottom:14px}
.cfr div{display:flex;justify-content:space-between;gap:14px;font-size:14px}
.cfr span{color:var(--mute)}.cfr b{font-weight:600;text-align:end;word-break:break-word}
/* home: what matters now */
.now{display:flex;flex-direction:column;gap:10px;margin:0 0 16px}
.now .k{animation:rise .7s var(--ease) both}

/* photos, music, one-tap */
.gal{padding:8px}
.pgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.pgrid img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:12px;background:#111}
.pgrid img:only-child{grid-column:1/-1;aspect-ratio:auto;max-height:340px}
.mediac{display:flex;gap:14px;align-items:center}
.mediac .art{flex:none;width:92px;height:92px;border-radius:18px;object-fit:cover;background:linear-gradient(135deg,var(--a),var(--c))}
.mediac .mt{flex:1;min-width:0}
.mediac b{display:block;font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mediac span{display:block;font-size:13px;color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mctl{display:flex;gap:10px;margin-top:10px}
.mctl button{width:42px;height:42px;border-radius:50%;border:1px solid var(--line);background:var(--glass2);color:var(--ink);font-size:16px;cursor:pointer;transition:transform .2s var(--spring)}
.mctl .pp{width:50px;height:50px;background:var(--ink);color:var(--bg);font-size:18px}
.mctl button:active{transform:scale(.9)}
.tap1{display:flex;justify-content:center;padding:14px}

/* a deck: several cards side by side, one per screen width */
.deck{display:flex;flex-direction:column;gap:8px;animation:rise .7s var(--ease) both}
.slides{display:flex;gap:10px;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;overscroll-behavior-x:contain}
.slides::-webkit-scrollbar{display:none}
.slides>.k{flex:0 0 100%;scroll-snap-align:center;max-height:58vh}
.dots{display:flex;justify-content:center;gap:6px}
.dots i{width:6px;height:6px;border-radius:99px;background:var(--line);transition:width .35s var(--ease),background .35s;cursor:pointer}
.dots i.on{width:18px;background:var(--ink)}

/* timers, phrases */
.timerc{display:flex;align-items:center;gap:18px}
.timerc svg{width:110px;height:110px;transform:rotate(-90deg)}
.timerc circle{fill:none;stroke-width:8}
.timerc .tbg{stroke:rgba(255,255,255,.08)}
.timerc .tfg{stroke:var(--b);stroke-linecap:round;stroke-dasharray:327;transition:stroke-dashoffset 1s linear}
.timerc .tt b{display:block;font-size:40px;font-weight:300;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.timerc .tt span{color:var(--mute);font-size:13px}
.timerc.done .tfg{stroke:var(--good)}
.phrase b{display:block;font-size:26px;font-weight:600;line-height:1.3}
.phrase span{display:block;color:var(--b);margin-top:4px}
.phrase em{display:block;font-style:normal;color:var(--mute);font-size:13px;margin:6px 0 12px}

/* places + audio */
.plist{padding:6px 14px 12px}
.pl{display:flex;align-items:center;gap:10px;padding:7px 0;border-top:1px solid var(--line)}
.pl:first-child{border-top:0}
.pl i{flex:none;width:22px;height:22px;border-radius:50%;display:grid;place-items:center;background:var(--a);color:#fff;font-style:normal;font-size:11px;font-weight:700}
.pl div{flex:1;min-width:0}.pl b{display:block;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.pl span{font-size:12px;color:var(--mute)}
.audioc .ai{display:flex;align-items:center;gap:12px;padding:8px 0;border-top:1px solid var(--line)}
.audioc .ai:first-of-type{border-top:0}
.audioc img,.aiart{flex:none;width:44px;height:44px;border-radius:12px;object-fit:cover;background:linear-gradient(135deg,var(--a),var(--b))}
.audioc .ai div{flex:1;min-width:0}.audioc b{display:block;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.audioc span{font-size:12px;color:var(--mute)}
.aplay{flex:none;width:38px;height:38px;border-radius:50%;border:0;background:var(--ink);color:var(--bg);cursor:pointer}
.ai.playing .aplay{background:var(--b)}
.mk{width:20px;height:20px;border-radius:50%;background:var(--a);color:#fff;font:700 11px/20px sans-serif;text-align:center;border:2px solid #fff}

/* settings */
.langs{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px}
.lang{display:flex;align-items:center;gap:9px;padding:10px 12px;border-radius:14px;background:var(--glass);border:1px solid var(--line);font-size:14px;cursor:pointer;text-align:start;transition:.25s var(--ease)}
.lang:hover{background:var(--glass2)}
.lang i{flex:none;width:14px;height:14px;border-radius:50%;border:2px solid var(--faint);transition:.25s var(--ease)}
.lang.on{border-color:rgba(139,123,255,.55);background:rgba(139,123,255,.1)}
.lang.on i{border-color:var(--a);background:var(--a);box-shadow:inset 0 0 0 3px #12141d}
.lang.wide{grid-column:1/-1}
.other{display:flex;gap:8px;margin-top:8px}
.other input{flex:1;min-width:0;background:rgba(0,0,0,.3);border:1px solid var(--line);border-radius:13px;color:var(--ink);font:inherit;font-size:14px;padding:10px 12px;outline:none}
.sheet .lbl{margin-top:20px}
[dir=rtl] .ask{justify-content:flex-start}
[dir=rtl] .ask span{border-radius:20px 20px 20px 6px}

/* connections sheet */
.conn{white-space:nowrap;background:var(--glass);border:1px solid var(--line);border-radius:99px;padding:5px 11px;font-size:12px;color:var(--mute);cursor:pointer;display:flex;align-items:center;gap:6px;transition:background .25s}
.conn:hover{background:var(--glass2)}
.conn i{width:6px;height:6px;border-radius:50%;background:var(--good)}
.veil{position:absolute;inset:0;z-index:8;background:rgba(4,5,9,.72);opacity:0;pointer-events:none;transition:opacity .45s var(--ease)}
.sheet{position:absolute;left:0;right:0;bottom:0;z-index:9;max-height:82%;overflow-y:auto;scrollbar-width:none;background:#12141d;border-top:1px solid var(--line);border-radius:30px 30px 0 0;padding:10px 20px 28px;transform:translateY(105%);visibility:hidden;transition:transform .6s var(--spring),visibility 0s .6s}
body.sheet-open .veil,body.mem-open .veil,body.set-open .veil{opacity:1;pointer-events:auto}
body.mem-open #memSheet,body.set-open #setSheet{transform:none;visibility:visible;transition:transform .6s var(--spring),visibility 0s}
body.sheet-open .sheet{transform:none;visibility:visible;transition:transform .6s var(--spring),visibility 0s}
.sheet .grab{width:38px;height:5px;border-radius:9px;background:rgba(255,255,255,.18);margin:0 auto 16px}
.sheet h2{font-size:22px;font-weight:650;letter-spacing:-.02em}
.sheet .sub{color:var(--mute);font-size:13px;margin:4px 0 16px}
.sheet .lbl{font-size:11px;letter-spacing:.12em;color:var(--faint);font-weight:600;margin:18px 0 8px}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.svc{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:16px;background:var(--glass);border:1px solid var(--line);font-size:13px}
.svc i{flex:none;width:7px;height:7px;border-radius:50%;background:var(--good)}
.svc.bad i{background:var(--bad)}
.svc span{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.svc small{color:var(--faint);font-size:11px}
.add{display:flex;flex-direction:column;gap:8px}
.add input{background:rgba(0,0,0,.3);border:1px solid var(--line);border-radius:13px;color:var(--ink);font:inherit;font-size:14px;padding:10px 12px;outline:none}
.add input:focus{border-color:var(--a)}
.add .msg{font-size:12px;color:var(--mute);min-height:1.2em}

@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>

<script>/*__I18N__*/</script>
<script>
const $ = s => document.querySelector(s), feed = $('#feed'), q = $('#q');
let PROFILE = localStorage.getItem('lumen.profile') || 'personal';
const api = (url, opts = {}) => fetch(url, { ...opts, headers: { ...(opts.headers || {}), 'x-lumen-profile': PROFILE, ...(opts.method === 'POST' ? { 'content-type': 'application/json' } : {}) } });
// Diagnostics: errors, failed requests, slow answers and bridge problems are batched to /telemetry.
const INSTALL = localStorage.getItem('lumen.install') || (localStorage.setItem('lumen.install', Math.random().toString(36).slice(2, 12)), localStorage.getItem('lumen.install'));
const telq = [];
const tel = (level, kind, msg, data) => { telq.push({ t: new Date().toISOString(), level, kind, msg: String(msg ?? '').slice(0, 1500), data }); if (telq.length > 40) telq.shift(); if (level === 'error') setTimeout(flushTel, 500); };
function flushTel() {
  if (!telq.length) return;
  const body = JSON.stringify({ install: INSTALL, app: window.LumenNative ? 'android' : 'web', version: '0.7', os: navigator.platform, device: navigator.userAgent.slice(0, 60), events: telq.splice(0) });
  if (document.visibilityState === 'hidden' && navigator.sendBeacon) navigator.sendBeacon('/telemetry', new Blob([body], { type: 'application/json' }));
  else fetch('/telemetry', { method: 'POST', headers: { 'content-type': 'application/json' }, body, keepalive: true }).catch(() => {});
}
setInterval(flushTel, 8000);
addEventListener('visibilitychange', () => { if (document.visibilityState === 'hidden') flushTel(); });
const report = (what, detail) => tel('error', what, detail);
addEventListener('error', e => tel('error', 'js', `${e.message} @${e.filename?.split('/').pop()}:${e.lineno}:${e.colno}`, { stack: e.error?.stack?.slice(0, 800) }));
addEventListener('unhandledrejection', e => tel('error', 'promise', e.reason?.message || String(e.reason), { stack: e.reason?.stack?.slice(0, 800) }));

/* ---------------- language: follows the phone unless the person picks one ---------------- */
const I18N = window.LUMEN_I18N || { langs: [['en', 'English']], rtl: [], strings: { en: {} } };
const normLang = tag => { const v = String(tag || 'en').trim(); if (/^zh[-_](tw|hk|mo|hant)/i.test(v)) return 'zh-Hant'; if (/^zh/i.test(v)) return 'zh'; const b = v.toLowerCase().split(/[-_]/)[0]; return /^[a-z]{2,3}$/.test(b) ? b : 'en'; };
const PHONE_LANG = normLang(navigator.language);
let LANG = localStorage.getItem('lumen.lang') || PHONE_LANG;
let STR = I18N.strings[LANG] || JSON.parse(localStorage.getItem('lumen.str.' + LANG + '.' + Object.keys(I18N.strings.en).length) || 'null') || I18N.strings.en;

    ${srow(null, t('h_wake'), (h.wakeRunning ? t('h_wake_on') : t('h_wake_off')) + ' · ' + t('h_wake_dot'), swb(h.wake, 'data-wake'))}
    ${srow(null, t('h_wake_off_screen'), t('h_wake_off_screen_sub'), swb(h.wakeScreenOff, 'data-pref="wakeScreenOff"'))}
    ${srow(null, t('h_drive_auto'), t('h_drive_auto_sub'), swb(h.drivingAuto, 'data-pref="drivingAuto"'))}
    ${srow(null, t('h_drive_now'), t('h_drive_now_sub'), swb(h.driving, 'data-pref="driving"'))}
  </div>
  <div class="sgroup"><h3>${esc(t('set_app'))}</h3>${srow(null, t('h_mode'), t('h_mode_sub'), `<button class="go" data-fix="mode">${esc(t('h_change'))}</button>`)}${srow(h.installs ? '' : 'idle', 'Lumen ' + h.version, h.installs ? t('h_updates_on') : t('h_updates_off'), `<button class="go" data-update>${esc(t('check_update'))}</button>`)}</div>`;
  document.body.classList.toggle('driving', !!h.driving);
}
async function loadJobs() {
  const box = $('#setJobs'); const r = await (await api('/receipts')).json().catch(() => null); if (!r) return;
  const when = j => j.trigger ? t('when_notif', { app: j.trigger.app }) : j.when?.at ? new Date(j.when.at).toLocaleString(LANG) : `${j.when?.every || ''} ${j.when?.time || ''}`;
  const jobs = r.jobs.map(j => srow(j.on ? '' : 'idle', j.title, when(j) + (j.next ? ' · ' + t('next') + ' ' + new Date(j.next).toLocaleString(LANG, { weekday: 'short', hour: '2-digit', minute: '2-digit' }) : ''), swb(j.on, `data-jobtoggle="${esc(j.id)}"`) + `<button class="go" data-jobdel="${esc(j.id)}">×</button>`)).join('');
  const rc = r.receipts.slice(0, 12).map(x => `<div class="rcpt" id="rc-${esc(x.id)}"><b>${esc(x.title)}</b><span>${esc(new Date(x.at).toLocaleString(LANG))} · ${esc(x.kind === 'job' ? t('rc_job') : t('rc_turn'))}${x.ms ? ' · ' + (x.ms / 1000).toFixed(1) + ' s' : ''}</span>
    <div class="more">${x.result ? esc(x.result) + '<br>' : ''}${(x.tools || []).length ? esc(t('rc_tools')) + ': ' + esc(x.tools.join(', ')) + '<br>' : ''}${(x.apps || []).length ? esc(t('rc_apps')) + ': ' + esc(x.apps.join(', ')) + '<br>' : ''}${(x.held || []).length ? '<span class="warn">' + esc(t('rc_held')) + ': ' + esc(x.held.join(', ')) + '</span><br>' : ''}${(x.refused || []).length ? '<span class="warn">' + esc(t('rc_refused')) + ': ' + esc(x.refused.join(' / ')) + '</span>' : ''}</div></div>`).join('');
  box.innerHTML = `<div class="sgroup"><h3>${esc(t('set_jobs'))}</h3>${jobs || srow(null, t('jobs_none'), t('jobs_hint'))}</div><div class="sgroup"><h3>${esc(t('set_activity'))}</h3>${rc || srow(null, t('none_yet'), '')}</div>`;
}
async function loadSkills() {
  const box = $('#setSkills'); if (!NATIVE) { box.innerHTML = ''; return; }
  const r = await nativeCall('skillList', {}); if (!r.ok) return;
  box.innerHTML = `<div class="sgroup"><h3>${esc(t('set_skills'))}</h3>${r.data.map(k => srow(null, k.name, `${k.when || ''}${k.when ? ' · ' : ''}${t('steps_n', { n: k.steps })}${k.uses ? ' · ' + t('used_n', { n: k.uses }) : ''}`, '', `data-skill="${esc(k.name)}" class="srow click"`) + `<div class="sk-steps" data-skillbox="${esc(k.name)}"></div>`).join('') || srow(null, t('skills_none'), t('skills_hint'))}</div>`;
}
const STEP_KINDS = ['open', 'tap', 'type', 'scroll', 'press', 'wait', 'expect', 'toggle'];
const stepText = s => { const k = STEP_KINDS.find(k => k in s) || 'tap'; const v = s[k]; return [k, k === 'open' ? (v?.name || v?.link || v?.pkg || v) : k === 'type' ? (v?.text ?? v) + (v?.into?.text ? ' → ' + v.into.text : '') : v]; };
const stepFrom = (k, v) => k === 'open' ? { open: { name: v } } : k === 'type' ? (v.includes(' → ') ? { type: { text: v.split(' → ')[0], into: { text: v.split(' → ')[1] } } } : { type: { text: v } }) : k === 'wait' ? { wait: +v || 800 } : { [k]: v };
$('#setSheet').addEventListener('click', async e => {
  const q = s => e.target.closest(s);
  let b;
  if ((b = q('[data-fix]'))) { await nativeCall('fix', { what: b.dataset.fix }); return; }
  if ((b = q('[data-wake]'))) { const on = !b.classList.contains('on'); b.classList.toggle('on', on); await nativeCall('wakeWord', { on }); setTimeout(loadHealth, 1500); return; }
  if ((b = q('[data-pref]'))) { const on = !b.classList.contains('on'); b.classList.toggle('on', on); await nativeCall('prefs', { [b.dataset.pref]: on }); if (b.dataset.pref === 'driving') document.body.classList.toggle('driving', on); return; }
  if ((b = q('[data-update]'))) { b.textContent = t('update_getting'); const r = await nativeCall('appUpdate', {}); b.textContent = r.ok ? (r.data.upToDate ? t('update_latest') : t('update_installing')) : t('update_now'); if (!r.ok) toast(/allow_installs/.test(r.error) ? t('update_allow') : r.error); return; }
  if ((b = q('[data-jobtoggle]'))) { const on = !b.classList.contains('on'); b.classList.toggle('on', on); await api('/jobs', { method: 'POST', body: JSON.stringify({ action: on ? 'resume' : 'pause', id: b.dataset.jobtoggle }) }); loadJobs(); return; }
  if ((b = q('[data-jobdel]'))) { if (!confirm(t('job_delete_q'))) return; await api('/jobs', { method: 'POST', body: JSON.stringify({ action: 'remove', id: b.dataset.jobdel }) }); loadJobs(); return; }
  if ((b = q('.rcpt'))) { b.classList.toggle('open'); return; }
  if ((b = q('[data-skill]'))) {
    const name = b.dataset.skill, box = b.nextElementSibling; b.classList.toggle('open');
    if (!b.classList.contains('open')) return;
    const r = await nativeCall('skillGet', { name }); if (!r.ok) return; const sk = r.data;
    box.innerHTML = (sk.steps || []).map(s => { const [k, v] = stepText(s); return `<div class="sk-step"><small>${esc(k)}</small><input data-kind="${esc(k)}" value="${esc(String(v ?? ''))}"><button data-stepdel>×</button></div>`; }).join('')
      + `<div class="sk-act"><button class="btn p" data-sksave="${esc(name)}">${esc(t('save'))}</button><button class="btn" data-skrun="${esc(name)}">${esc(t('run_now'))}</button><button class="btn" data-skdel="${esc(name)}">${esc(t('remove'))}</button></div>`;
    box.dataset.when = sk.when || ''; box.dataset.app = sk.app || ''; box.dataset.params = JSON.stringify(sk.params || []);
    return;
  }
  if ((b = q('[data-stepdel]'))) { b.closest('.sk-step').remove(); return; }
  if ((b = q('[data-sksave]'))) { const box = b.closest('.sk-steps'); const steps = [...box.querySelectorAll('.sk-step input')].map(i => stepFrom(i.dataset.kind, i.value)); const r = await nativeCall('skillSave', { name: b.dataset.sksave, when: box.dataset.when, app: box.dataset.app, params: JSON.parse(box.dataset.params || '[]'), steps }); toast(r.ok ? '✓ ' + t('saved') : r.error); loadSkills(); return; }
  if ((b = q('[data-skrun]'))) { document.body.classList.remove('set-open'); nativeCall('skillRun', { name: b.dataset.skrun, params: {} }); return; }
  if ((b = q('[data-skdel]'))) { if (!confirm(t('skill_delete_q'))) return; await nativeCall('skillDelete', { name: b.dataset.skdel }); loadSkills(); return; }
});
async function chooseLang(code) {
  if (code === '__other') { $('#otherBox').hidden = false; $('#otherLang').focus(); return; }
  if (code) localStorage.setItem('lumen.lang', code); else localStorage.removeItem('lumen.lang');
  const r = await (await api('/settings', { method: 'POST', body: JSON.stringify({ lang: code || null }) })).json().catch(() => ({}));
  const target = r.lang || code || PHONE_LANG;
  if (r.lang) localStorage.setItem('lumen.lang', r.lang);
  await useLang(target); loadConn(); openSettings();
}
$('#setBtn').onclick = openSettings;
$('#look').onclick = () => look(!lookStream);
$('#langList').onclick = e => { const b = e.target.closest('[data-lang]'); if (b) chooseLang(b.dataset.lang); };
$('#otherSave').onclick = () => { const v = $('#otherLang').value.trim(); if (v) { $('#otherBox').hidden = true; chooseLang(v); } };
$('#resetLook').onclick = async () => { await api('/settings', { method: 'POST', body: JSON.stringify({ resetLook: true }) }); localStorage.removeItem('lumen.prefs'); location.reload(); };

if ('serviceWorker' in navigator) navigator.serviceWorker.register('/sw.js').catch(() => {});
const qIn = new URLSearchParams(location.search), shareRaw = qIn.get('share'), askIn = qIn.get('ask');
const openIn = qIn.get('open'); if (openIn) history.replaceState(null, '', '/');
const prefillIn = qIn.get('prefill'); if (prefillIn) { history.replaceState(null, '', '/'); setTimeout(() => { q.value = prefillIn.slice(0, 1500); q.focus(); }, 700); }
async function openReceipt(id) { await openSettings(); setTimeout(() => { const el2 = document.getElementById('rc-' + id); if (el2) { el2.classList.add('open'); el2.scrollIntoView({ block: 'center', behavior: 'smooth' }); } }, 700); }
const sharedIn = askIn || (shareRaw && (shareRaw.startsWith('(shared)') ? shareRaw : '(shared) ' + shareRaw)); if (shareRaw || askIn) history.replaceState(null, '', '/');
(async () => { paintProfile(); if (!I18N.strings[LANG] && !localStorage.getItem('lumen.str.' + LANG + '.' + Object.keys(I18N.strings.en).length)) { try { await useLang(LANG); } catch {} } applyStatic(); await boot(); if (openIn?.startsWith('receipt:')) openReceipt(openIn.slice(8)); if (NATIVE) phoneCmds(); if (NATIVE) nativeCall('health', {}).then(r => { if (r.ok) document.body.classList.toggle('driving', !!r.data.driving); }); if (sharedIn) setTimeout(() => { if (askIn && !shareRaw) ask(sharedIn.slice(0, 1500), { kind: 'typed' }); else { q.value = sharedIn.slice(0, 1500); q.focus(); } }, 600); })();
$('#connBtn').onclick = () => { loadConn(); document.body.classList.add('sheet-open'); };
let findT;
$('#findForm').onsubmit = e => { e.preventDefault(); findNow(); };
$('#findQ').oninput = () => { clearTimeout(findT); findT = setTimeout(findNow, 450); };
async function findNow() {
  const q = $('#findQ').value.trim(), box = $('#found');
  if (!q) { box.innerHTML = ''; return; }
  box.innerHTML = `<p class="sub">${esc(t('finding'))}</p>`;
  const r = await (await api('/find?lang=' + encodeURIComponent(LANG) + '&q=' + encodeURIComponent(q))).json().catch(() => ({ items: [] }));
  if (q !== $('#findQ').value.trim()) return; // a newer search is on its way
  box.innerHTML = r.items.length ? R.connect({ items: r.items }) : `<p class="sub">${esc(t('none_found'))}</p>`;
}
$('#apiList').onclick = async e => { const b = e.target.closest('[data-rmapi]'); if (!b) return; await api('/apikey/remove', { method: 'POST', body: JSON.stringify({ id: b.dataset.rmapi }) }); loadConn(); };
$('#found').onclick = e => { const b = e.target.closest('[data-connect]'); if (b) connect(b.closest('.cn'), { quiet: true }); };
</script>
