<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>
  :root { --bg: #07080d; --card: #12151d; --line: #242a36; --text: #eef1f6; --soft: #9aa3b5; --accent: #8fb4ff; --ok: #6fd3a0; --bad: #ff8a8a; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); font: 17px/1.5 system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
  main { min-height: 100%; display: flex; flex-direction: column; justify-content: center; padding: 40px 26px calc(40px + env(safe-area-inset-bottom)); max-width: 520px; margin: 0 auto; }
  .orb { width: 96px; height: 96px; border-radius: 50%; margin: 0 0 34px; background: conic-gradient(from 0deg, #8fb4ff, #b99cff, #7fe0c8, #8fb4ff); filter: saturate(1.1); animation: spin 8s linear infinite, breathe 3.2s ease-in-out infinite; }
  .orb.busy { animation-duration: 2.4s, 1.4s; }
  @keyframes spin { to { transform: rotate(360deg); } }
  @keyframes breathe { 50% { scale: 1.06; } }
  h1 { font-size: 30px; line-height: 1.15; margin: 0 0 10px; letter-spacing: -0.01em; }
  p { color: var(--soft); margin: 0 0 26px; }
  .step { display: flex; gap: 12px; align-items: center; padding: 12px 0; border-top: 1px solid var(--line); color: var(--soft); transition: color .3s; }
  .step b { font-weight: 500; }
  .dot { width: 22px; height: 22px; border-radius: 50%; border: 1.5px solid var(--line); flex: none; display: grid; place-items: center; transition: background .3s, border-color .3s; }
  .step.now { color: var(--text); } .step.now .dot { border-color: var(--accent); }
  .step.done { color: var(--text); } .step.done .dot { background: var(--ok); border-color: var(--ok); }
  .step.done .dot::after { content: ""; width: 9px; height: 5px; border-left: 2px solid #07080d; border-bottom: 2px solid #07080d; transform: translateY(-1px) rotate(-45deg); }
  button { width: 100%; margin-top: 22px; padding: 16px; border: 0; border-radius: 16px; background: var(--accent); color: #07080d; font: inherit; font-weight: 600; transition: transform .15s, opacity .2s; }
  button:active { transform: scale(.98); }
  button.ghost { background: transparent; color: var(--soft); border: 1px solid var(--line); margin-top: 10px; font-weight: 400; }
  input { width: 100%; padding: 14px; border-radius: 14px; border: 1px solid var(--line); background: var(--card); color: var(--text); font: inherit; margin-top: 10px; }
  .err { color: var(--bad); font-size: 15px; min-height: 1.4em; margin-top: 14px; }
  details { margin-top: 22px; color: var(--soft); font-size: 15px; } summary { cursor: pointer; }
  [hidden] { display: none !important; }
  @media (prefers-reduced-motion: reduce) { .orb { animation: none; } }
</style>
</head>
<body>
<main>
  <div class="orb busy" id="orb"></div>
  <h1 id="title">Connect to your assistant</h1>
  <p id="sub">Your phone talks to your own server over a private network. Nothing goes through anyone else's computers.</p>
  <div class="step" id="s1"><span class="dot"></span><b>Start the private connection</b></div>
  <div class="step" id="s2"><span class="dot"></span><b>Sign in to Tailscale</b></div>
  <div class="step" id="s3"><span class="dot"></span><b>Find your server</b></div>
  <button id="go" hidden>Sign in to Tailscale</button>
  <div class="err" id="err" role="status"></div>
  <details id="manual"><summary>Enter the server address yourself</summary>
    <input id="addr" placeholder="lumen.your-tailnet.ts.net" autocapitalize="off" autocorrect="off" spellcheck="false">
    <button class="ghost" id="useAddr">Use this address</button>
    <input id="ctl" placeholder="Own coordination server (Headscale), optional" autocapitalize="off" spellcheck="false">
    <button class="ghost" id="useCtl">Save, applies after restarting the app</button>
  </details>
</main>
<script>
const $ = s => document.getElementById(s), L = window.LumenConnect;
let finding = false, done = false;
function mark(n, cls) { ['s1', 's2', 's3'].forEach((id, i) => $(id).className = 'step ' + (i < n ? 'done' : i === n ? cls || 'now' : '')); }
function tick() {
  if (done) return;
  let s = {}; try { s = JSON.parse(L.status()); } catch {}
  const st = s.state || 'starting';
  $('go').hidden = true;
  if (st === 'needs_login') { mark(1); $('go').hidden = false; $('sub').textContent = 'Sign in with the same Tailscale account your server uses.'; }
  else if (st === 'running') {
    mark(2);
    if (s.server) return finish(s.name);
    if (!finding) { finding = true; setTimeout(() => { const ok = L.find(); finding = false; if (ok) { const t = JSON.parse(L.status()); finish(t.name); } else $('err').textContent = JSON.parse(L.status()).error; }, 50); }
  } else if (st.startsWith('error')) { mark(0); $('err').textContent = st.slice(7); }
  else mark(0);
  if (s.error && st !== 'running') $('err').textContent = s.error;
}
function finish(name) {
  done = true; mark(3); $('orb').classList.remove('busy');
  $('title').textContent = name ? `Found ${name}` : 'Connected';
  $('sub').textContent = 'Opening…'; $('err').textContent = '';
  setTimeout(() => L.open(), 700);
}
$('go').onclick = () => L.login();
$('useAddr').onclick = () => { $('err').textContent = 'Checking…'; setTimeout(() => { if (L.use($('addr').value)) finish(JSON.parse(L.status()).name); else $('err').textContent = JSON.parse(L.status()).error; }, 30); };
$('useCtl').onclick = () => { L.control($('ctl').value); $('err').textContent = 'Saved. Close and reopen the app.'; };
tick(); setInterval(tick, 1500);
</script>
</body>
</html>
